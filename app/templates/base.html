<!doctype html>

<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Unit converter</title>
	<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<header class="sticky-top">
		<nav class="navbar navbar-expand navbar-dark bg-success shadow-sm">
			<div class="container-fluid flex-nowrap gap-2">
				<a class="navbar-brand flex-shrink-0 fw-semibold" href="{{ url_for('index') }}">Unit converter</a>
				<div class="navbar-nav flex-row flex-nowrap gap-2 ms-auto overflow-x-auto" style="min-width: 0;">
					<a class="nav-link text-nowrap {% if unit_of == 'length' %}active fw-bold{% endif %}"
					   href="{{ url_for('length') }}">Length</a>
					<a class="nav-link text-nowrap {% if unit_of == 'weight' %}active fw-bold{% endif %}"
					   href="{{ url_for('weight') }}">Weight</a>
					<a class="nav-link text-nowrap {% if unit_of == 'temperature' %}active fw-bold{% endif %}"
					   href="{{ url_for('temperature') }}">Temperature</a>
				</div>
			</div>
		</nav>
	</header>

	<main class="container py-5">
		<h1 class="h3 text-center text-success-emphasis mb-4">
			{% if unit_of %}Convert {{ unit_of }}{% else %}Unit converter{% endif %}
		</h1>
		<div class="d-flex justify-content-center">
			{% block content %}{% endblock %}
		</div>
	</main>
</body>
</html>
